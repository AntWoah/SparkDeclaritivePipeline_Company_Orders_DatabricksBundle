# This is a Databricks asset bundle definition for SDP_CompanyOrders_Bundle.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: SDP_CompanyOrders_Bundle
  uuid: 65cb0335-0c4c-46f4-9402-34b9908d4e66

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-478eaad2-4283.cloud.databricks.com
    variables:
      catalog: dev
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-478eaad2-4283.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/anttyjosh3831@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/anttyjosh3831@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dev
      schema: prod
    permissions:
      - user_name: anttyjosh3831@gmail.com
        level: CAN_MANAGE
